name: TeraSim CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Check out repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: "0.12.3"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-packages --group dev

    - name: Run tests
      run: uv run --with carla==0.9.16 pytest tests

    - name: Build package wheels
      run: |
        uv build --package terasim --wheel
        uv build --package terasim-nde-nade --wheel
        uv build --package terasim-service --wheel
        uv build --package terasim-vis --wheel
